name: StatoiseGit
options:
  bundleIdPrefix: com.statoisegit
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

schemes:
  StatoiseGit:
    build:
      targets:
        StatoiseGit: all
        StatoiseGitTests: [test]
        StatoiseGitUITests: [test]
    test:
      targets:
        - StatoiseGitTests
        - StatoiseGitUITests

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_ALLOW_ENTITLEMENTS_MODIFICATION: YES

targets:
  StatoiseGit:
    type: application
    platform: macOS
    sources:
      - Sources/App
      - Sources/GitOperations
      - Sources/Shared
      - path: Resources/Assets.xcassets
        buildPhase: resources
    resources:
      - path: Resources/OverlayIcons
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.statoisegit.app
        INFOPLIST_FILE: Sources/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/App/StatoiseGit.entitlements
        PRODUCT_NAME: "Statoise Git"
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: StatoiseGitFinderExtension

  StatoiseGitFinderExtension:
    type: app-extension
    platform: macOS
    sources:
      - FinderExtension
      - Sources/Shared
      - Sources/GitOperations
    resources:
      - path: FinderExtension/OverlayIcons
        buildPhase: resources
    dependencies:
      - sdk: FinderSync.framework
      - sdk: UserNotifications.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.statoisegit.app.FinderExtension
        INFOPLIST_FILE: FinderExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: FinderExtension/StatoiseGitFinderExtension.entitlements
        PRODUCT_NAME: StatoiseGitFinderExtension
        SKIP_INSTALL: YES
    postCompileScripts: []

  StatoiseGitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - Sources/GitOperations
      - Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.statoisegit.app.tests
        PRODUCT_NAME: StatoiseGitTests
        GENERATE_INFOPLIST_FILE: YES

  StatoiseGitUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
    dependencies:
      - target: StatoiseGit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.statoisegit.app.uitests
        PRODUCT_NAME: StatoiseGitUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: StatoiseGit
