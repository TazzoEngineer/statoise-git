---
format_version: "26"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: macos

meta:
  bitrise.io:
    stack: osx-xcode-26.5.x
    machine_type_id: g2.mac.medium

app:
  envs:
    - BITRISE_PROJECT_PATH: StatoiseGit/StatoiseGit.xcodeproj
      opts:
        is_expand: false
    - BITRISE_SCHEME: StatoiseGit
      opts:
        is_expand: false
    - BITRISE_EXPORT_METHOD: none
      opts:
        is_expand: false

workflows:
  primary:
    steps:
      - script@1:
          title: Script Build Channel
          inputs:
            - content: |-
                set -ex
                envman add --key BUILD_CHANNEL --value "preview"

      - script@1:
          title: Script Outer Version
          inputs:
            - content: |-
                set -ex
                envman add --key OUTER_VERSION --value "1.0.0"

      - script@1:
          title: Script Build Env
          inputs:
            - content: |-
                set -ex
                envman add --key GIT_TAG_BUILD --value "${BUILD_CHANNEL}-${OUTER_VERSION}.${BITRISE_BUILD_NUMBER}"
                envman add --key FULLY_VERSION --value "${OUTER_VERSION}-${BUILD_CHANNEL}.${BITRISE_BUILD_NUMBER}"

      - activate-ssh-key@4: {}
      - git-clone@8: {}

      - git-tag@1:
          inputs:
            - tag: "$GIT_TAG_BUILD"

      - script@1:
          title: Install xcodegen
          inputs:
            - content: |
                set -euo pipefail
                export HOMEBREW_NO_AUTO_UPDATE=1
                if ! command -v xcodegen >/dev/null 2>&1; then
                  brew install xcodegen
                fi
                xcodegen --version

      - script@1:
          title: Generate Xcode project
          inputs:
            - content: |
                set -euo pipefail
                cd StatoiseGit
                xcodegen generate
                echo "Generated project successfully"

      - script@1:
          title: Patch version in Info.plist
          inputs:
            - content: |
                set -euo pipefail
                PLIST="StatoiseGit/Sources/App/Info.plist"
                /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${OUTER_VERSION}" "$PLIST"
                /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_CHANNEL}.${BITRISE_BUILD_NUMBER}" "$PLIST"
                echo "Version: ${OUTER_VERSION} (${BUILD_CHANNEL}.${BITRISE_BUILD_NUMBER})"

      - script@1:
          title: Build (Debug)
          inputs:
            - content: |
                set -euo pipefail

                cd StatoiseGit

                xcodebuild \
                  -project StatoiseGit.xcodeproj \
                  -scheme "$BITRISE_SCHEME" \
                  -configuration Debug \
                  -destination "generic/platform=macOS" \
                  -derivedDataPath ../build/DerivedData \
                  build \
                  CODE_SIGN_IDENTITY="-" \
                  CODE_SIGNING_REQUIRED=NO \
                  CODE_SIGNING_ALLOWED=YES

                echo "Build succeeded"

      - script@1:
          title: Run Unit Tests
          inputs:
            - content: |
                set -euo pipefail

                cd StatoiseGit

                xcodebuild \
                  -project StatoiseGit.xcodeproj \
                  -scheme "$BITRISE_SCHEME" \
                  -configuration Debug \
                  -destination "platform=macOS" \
                  -derivedDataPath ../build/DerivedData \
                  test \
                  -only-testing:StatoiseGitTests \
                  CODE_SIGN_IDENTITY="-" \
                  CODE_SIGNING_REQUIRED=NO \
                  CODE_SIGNING_ALLOWED=YES

                echo "Tests passed"

      - script@1:
          title: Script artifacts
          inputs:
            - content: |
                set -euo pipefail

                APP_PATH="build/DerivedData/Build/Products/Debug/Statoise Git.app"
                if [ -d "$APP_PATH" ]; then
                  ditto "$APP_PATH" "$BITRISE_DEPLOY_DIR/Statoise Git.app"
                  cp scripts/install.sh "$BITRISE_DEPLOY_DIR/install.sh"
                  cd "$BITRISE_DEPLOY_DIR"
                  zip -r -y "StatoiseGit-${FULLY_VERSION}.zip" "Statoise Git.app" install.sh
                  rm -rf "Statoise Git.app" install.sh
                fi

      - deploy-to-bitrise-io@2: {}

    triggers:
      push:
        - branch: master
      pull_request:
        - source_branch: "*"
