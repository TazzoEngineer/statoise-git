---
format_version: "26"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: macos

meta:
  bitrise.io:
    stack: osx-xcode-26.5.x
    machine_type_id: g2.mac.medium

app:
  envs:
    - BITRISE_PROJECT_PATH: StatoiseGit/StatoiseGit.xcodeproj
      opts:
        is_expand: false
    - BITRISE_SCHEME: StatoiseGit
      opts:
        is_expand: false
    - BITRISE_EXPORT_METHOD: none
      opts:
        is_expand: false

workflows:
  primary:
    steps:
      - activate-ssh-key@4: {}
      - git-clone@8: {}

      - script@1:
          title: Install xcodegen
          inputs:
            - content: |
                set -euo pipefail
                export HOMEBREW_NO_AUTO_UPDATE=1
                if ! command -v xcodegen >/dev/null 2>&1; then
                  brew install xcodegen
                fi
                xcodegen --version

      - script@1:
          title: Generate Xcode project
          inputs:
            - content: |
                set -euo pipefail
                cd StatoiseGit
                xcodegen generate
                echo "Generated project successfully"

      - script@1:
          title: Build (Debug)
          inputs:
            - content: |
                set -euo pipefail

                cd StatoiseGit

                xcodebuild \
                  -project StatoiseGit.xcodeproj \
                  -scheme "$BITRISE_SCHEME" \
                  -configuration Debug \
                  -destination "generic/platform=macOS" \
                  -derivedDataPath ../build/DerivedData \
                  build \
                  CODE_SIGN_IDENTITY="-" \
                  CODE_SIGNING_REQUIRED=NO \
                  CODE_SIGNING_ALLOWED=YES

                echo "Build succeeded"

      - deploy-to-bitrise-io@2: {}

    triggers:
      push:
        - branch: master
      pull_request:
        - source_branch: "*"
