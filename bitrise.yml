---
format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

app:
  envs:
    - PROJECT_PATH: StatoiseGit/StatoiseGit.xcodeproj
    - SCHEME: StatoiseGit
    - EXPORT_METHOD: developer-id
    - TEAM_ID: $APPLE_TEAM_ID
    - BUNDLE_ID: com.statoisegit.app

meta:
  bitrise.io:
    stack: osx-xcode-16.0.x
    machine_type_id: g2-m1.8core

trigger_map:
  - push_branch: master
    pipeline: pipeline-debug
  - pull_request_source_branch: "*"
    pipeline: pipeline-debug

pipelines:
  pipeline-debug:
    stages:
      - stage-build-debug: {}

  pipeline-release:
    stages:
      - stage-build-release: {}

stages:
  stage-build-debug:
    workflows:
      - build-debug: {}

  stage-build-release:
    workflows:
      - build-release: {}

workflows:
  # ----------------------------
  # Debug build (master push, PRs)
  # ----------------------------
  build-debug:
    steps:
      - git-clone@8: {}

      - script@1:
          title: Install xcodegen
          inputs:
            - content: |
                set -euo pipefail
                export HOMEBREW_NO_AUTO_UPDATE=1
                if ! command -v xcodegen >/dev/null 2>&1; then
                  brew install xcodegen
                fi
                xcodegen --version

      - script@1:
          title: Generate Xcode project
          inputs:
            - content: |
                set -euo pipefail
                cd StatoiseGit
                xcodegen generate
                echo "Generated project successfully"

      - script@1:
          title: Build (Debug, ad-hoc signing)
          inputs:
            - content: |
                set -euo pipefail

                cd StatoiseGit

                xcodebuild \
                  -project StatoiseGit.xcodeproj \
                  -scheme "$SCHEME" \
                  -configuration Debug \
                  -destination "generic/platform=macOS" \
                  -derivedDataPath ../build/DerivedData \
                  build \
                  CODE_SIGN_IDENTITY="-" \
                  CODE_SIGNING_REQUIRED=NO \
                  CODE_SIGNING_ALLOWED=YES

                echo "Build succeeded"

  # ----------------------------
  # Release build (manual trigger)
  # ----------------------------
  build-release:
    envs:
      - CONFIGURATION: Release
    steps:
      - git-clone@8: {}

      - script@1:
          title: Install xcodegen
          inputs:
            - content: |
                set -euo pipefail
                export HOMEBREW_NO_AUTO_UPDATE=1
                if ! command -v xcodegen >/dev/null 2>&1; then
                  brew install xcodegen
                fi

      - script@1:
          title: Generate Xcode project
          inputs:
            - content: |
                set -euo pipefail
                cd StatoiseGit
                xcodegen generate

      - certificate-and-profile-installer@1: {}

      - script@1:
          title: Build and Archive
          inputs:
            - content: |
                set -euo pipefail

                if [ -z "${TEAM_ID:-}" ]; then
                  echo "Error: TEAM_ID is not set. Configure APPLE_TEAM_ID in Bitrise Secrets."
                  exit 1
                fi

                cd StatoiseGit

                xcodebuild \
                  -project StatoiseGit.xcodeproj \
                  -scheme "$SCHEME" \
                  -configuration Release \
                  -destination "generic/platform=macOS" \
                  -archivePath "$BITRISE_DEPLOY_DIR/StatoiseGit.xcarchive" \
                  archive \
                  CODE_SIGN_IDENTITY="Developer ID Application" \
                  DEVELOPMENT_TEAM="$TEAM_ID"

      - script@1:
          title: Create DMG
          inputs:
            - content: |
                set -euo pipefail

                ARCHIVE_PATH="$BITRISE_DEPLOY_DIR/StatoiseGit.xcarchive"
                APP_PATH="$BITRISE_DEPLOY_DIR/Statoise Git.app"

                cp -R "$ARCHIVE_PATH/Products/Applications/Statoise Git.app" "$APP_PATH"

                VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
                  "$APP_PATH/Contents/Info.plist")

                DMG_NAME="StatoiseGit-${VERSION}.dmg"
                DMG_PATH="$BITRISE_DEPLOY_DIR/$DMG_NAME"

                hdiutil create -volname "Statoise Git" \
                  -srcfolder "$APP_PATH" \
                  -ov -format UDZO \
                  "$DMG_PATH"

                echo "Created DMG: $DMG_PATH"

      - deploy-to-bitrise-io@2: {}
