---
format_version: "26"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: macos

meta:
  bitrise.io:
    stack: osx-xcode-26.5.x
    machine_type_id: g2.mac.medium

app:
  envs:
    - BITRISE_PROJECT_PATH: StatoiseGit/StatoiseGit.xcodeproj
      opts:
        is_expand: false
    - BITRISE_SCHEME: StatoiseGit
      opts:
        is_expand: false
    - BITRISE_EXPORT_METHOD: none
      opts:
        is_expand: false

workflows:
  primary:
    steps:
      - activate-ssh-key@4: {}
      - git-clone@8: {}

      - script@1:
          title: Install xcodegen
          inputs:
            - content: |
                set -euo pipefail
                export HOMEBREW_NO_AUTO_UPDATE=1
                if ! command -v xcodegen >/dev/null 2>&1; then
                  brew install xcodegen
                fi
                xcodegen --version

      - script@1:
          title: Generate Xcode project
          inputs:
            - content: |
                set -euo pipefail
                cd StatoiseGit
                xcodegen generate
                echo "Generated project successfully"

      - script@1:
          title: Build (Debug)
          inputs:
            - content: |
                set -euo pipefail

                cd StatoiseGit

                xcodebuild \
                  -project StatoiseGit.xcodeproj \
                  -scheme "$BITRISE_SCHEME" \
                  -configuration Debug \
                  -destination "generic/platform=macOS" \
                  -derivedDataPath ../build/DerivedData \
                  build \
                  CODE_SIGN_IDENTITY="-" \
                  CODE_SIGNING_REQUIRED=NO \
                  CODE_SIGNING_ALLOWED=YES

                echo "Build succeeded"

                # Copy app to deploy dir for artifact upload
                APP_PATH="../build/DerivedData/Build/Products/Debug/Statoise Git.app"
                if [ -d "$APP_PATH" ]; then
                  ditto "$APP_PATH" "$BITRISE_DEPLOY_DIR/Statoise Git.app"
                  cd "$BITRISE_DEPLOY_DIR"

                  # Create install script
                  cat > install.sh << 'EOF'
#!/bin/bash
SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
APP_PATH="$SCRIPT_DIR/Statoise Git.app"
if [ ! -d "$APP_PATH" ]; then
  echo "Error: 'Statoise Git.app' not found in the same directory as this script."
  exit 1
fi
xattr -cr "$APP_PATH"
mkdir -p ~/Applications
rm -rf ~/Applications/"Statoise Git.app"
cp -R "$APP_PATH" ~/Applications/
open ~/Applications/"Statoise Git.app"
echo "Installed successfully."
EOF
                  chmod +x install.sh

                  zip -r -y "StatoiseGit-Debug.zip" "Statoise Git.app" install.sh
                  rm -rf "Statoise Git.app" install.sh
                fi

      - deploy-to-bitrise-io@2: {}

    triggers:
      push:
        - branch: master
      pull_request:
        - source_branch: "*"
